services:
  postgres:
    image: postgres:16-alpine
    container_name: jiwalu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_jiwalu
      POSTGRES_USER: jiwalu
      POSTGRES_PASSWORD: jiwalu_dev_password
    ports:
      - "5433:5432"
    volumes:
      - jiwalu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiwalu -d db_jiwalu"]
      interval: 5s
      timeout: 5s
      retries: 10

 
volumes:
  jiwalu_postgres:
  
